[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "instaseg-grpc"
version = "0.1.0"
description = "HTTP and gRPC image instance-segmentation services powered by SAM 2.1"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "grpcio>=1.84,<2",
    "huggingface-hub>=0.24,<2",
    "numpy>=1.24.4,<3",
    "pillow>=10.4,<13",
    "protobuf>=7.35.1,<8",
    "python-multipart>=0.0.18,<1",
    "sam-2",
    "torch>=2.5.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
instaseg-server = "instaseg.server:main"
instaseg-http = "instaseg.http_server:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84,<2",
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.uv.sources]
# This official commit contains the SAM 2.1 model/config release. Pinning it
# prevents installs from silently changing when the upstream branch moves.
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "98fcb164bf880f70799c324c283c758c4d20bf82" }

[tool.hatch.build.targets.wheel]
packages = ["src/instaseg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/instaseg/generated/*" = ["E501", "F401", "I001", "UP009"]
