<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InstaSeg · 图像分割工作台</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"
        >Insta<span>Seg</span><small>图像分割工作台</small></a
      ><span id="connection" class="connection">正在连接服务…</span>
    </header>
    <main>
      <div class="intro">
        <div class="eyebrow">INTERACTIVE SEGMENTATION</div>
        <h1>选中目标，让轮廓浮现。</h1>
        <p>上传一张图片，用一个点或一个选框，提取你关注的物体。</p>
      </div>
      <div class="workspace">
        <aside class="controls">
          <section>
            <h2><span class="step">01</span> 上传图片</h2>
            <label
              id="dropzone"
              class="dropzone"
              for="file"
              tabindex="0"
              role="button"
              ><span class="upload-icon">＋</span
              ><strong>点击上传 / 拖放图片</strong
              ><small>JPEG、PNG、WebP、BMP</small
              ><small id="limits">最大 20 MB</small></label
            >
            <input
              id="file"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/bmp"
              hidden
            />
            <p id="file-info" class="file-info">图片仅用于本次推理</p>
          </section>
          <section>
            <h2><span class="step">02</span> 标记目标</h2>
            <div class="modes" role="group" aria-label="提示模式">
              <button
                type="button"
                class="mode active"
                data-mode="point"
                aria-pressed="true"
              >
                ⊙ 选点</button
              ><button
                type="button"
                class="mode"
                data-mode="box"
                aria-pressed="false"
              >
                ▣ 画框
              </button>
            </div>
            <p id="hint" class="hint">在左侧图片中，点击目标内部的一个点。</p>
            <div class="prompt-info">
              <span id="prompt-info">尚未标记目标</span
              ><button id="clear" class="text-button" type="button" disabled>
                清除
              </button>
            </div>
          </section>
          <button id="run" type="button" class="primary" disabled>
            开始分割 <span>↗</span>
          </button>
          <p id="status" role="status" aria-live="polite">
            上传图片后即可开始。
          </p>
        </aside>
        <div class="panels">
          <section class="panel">
            <div class="panel-heading">
              <h2>原图与标记</h2>
              <span id="dimensions" class="badge">等待上传</span>
            </div>
            <div class="stage" id="input-stage">
              <div class="empty" id="input-empty">
                <span class="empty-symbol">▧</span
                ><strong>从一张图片开始</strong>
                <p>上传后在这里选点或画框</p>
              </div>
              <canvas
                id="canvas"
                aria-label="图片标注区域，选点模式点击，画框模式拖动"
                hidden
              ></canvas>
            </div>
          </section>
          <section class="panel">
            <div class="panel-heading">
              <h2>分割结果</h2>
              <div class="views" role="group" aria-label="结果显示方式">
                <button
                  class="view active"
                  data-view="overlay"
                  aria-pressed="true"
                >
                  叠加</button
                ><button class="view" data-view="mask" aria-pressed="false">
                  掩码</button
                ><button class="view" data-view="cutout" aria-pressed="false">
                  抠图
                </button>
              </div>
            </div>
            <div class="stage checker">
              <div class="empty" id="result-empty">
                <span class="empty-symbol">✧</span><strong>等待轮廓浮现</strong>
                <p>完成标记后，点击「开始分割」</p>
              </div>
              <img id="result" alt="分割结果" hidden />
            </div>
            <div class="result-footer">
              <span id="stats">结果将以原图分辨率输出</span>
              <div class="downloads">
                <a id="download-mask" download="instaseg-mask.png" hidden
                  >下载掩码 ↓</a
                ><a id="download-cutout" download="instaseg-cutout.png" hidden
                  >下载抠图 ↓</a
                >
              </div>
            </div>
          </section>
        </div>
      </div>
      <footer>InstaSeg <span>·</span> SAM 2.1 图像分割</footer>
    </main>
  </body>
</html>
